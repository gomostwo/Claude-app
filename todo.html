<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 32px 28px 24px;
      color: #fff;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stats {
      margin-top: 8px;
      font-size: 0.875rem;
      opacity: 0.85;
    }

    .add-form {
      display: flex;
      gap: 10px;
      padding: 24px 28px;
      border-bottom: 1px solid #f0f0f0;
    }

    .add-form input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input:focus { border-color: #667eea; }

    .add-form input::placeholder { color: #aaa; }

    .btn-add {
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.25rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      line-height: 1;
    }

    .btn-add:hover { opacity: 0.9; }
    .btn-add:active { transform: scale(0.95); }

    .filters {
      display: flex;
      gap: 6px;
      padding: 14px 28px;
      border-bottom: 1px solid #f0f0f0;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 2px solid transparent;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      background: #f5f5f5;
      color: #666;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #667eea;
      color: #fff;
    }

    .task-list {
      list-style: none;
      padding: 12px 0;
      min-height: 60px;
    }

    .task-list:empty::after {
      content: 'No tasks yet — add one above!';
      display: block;
      text-align: center;
      color: #ccc;
      padding: 28px 0;
      font-size: 0.9rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      transition: background 0.15s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover { background: #fafafa; }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #bbb;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #d0d0d0;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .task-item.completed .checkbox {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: transparent;
    }

    .checkbox::after {
      content: '';
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .task-item.completed .checkbox::after { opacity: 1; }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
      word-break: break-word;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ddd;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #e55; background: #fff0f0; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-top: 1px solid #f0f0f0;
      font-size: 0.82rem;
      color: #aaa;
    }

    .btn-clear {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .btn-clear:hover { color: #e55; background: #fff0f0; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>My To-Do List</h1>
      <div class="stats" id="stats">0 tasks</div>
    </div>

    <form class="add-form" id="addForm">
      <input type="text" id="taskInput" placeholder="Add a new task…" autocomplete="off" />
      <button type="submit" class="btn-add" title="Add task">+</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="footer">
      <span id="remaining"></span>
      <button class="btn-clear" id="clearCompleted">Clear completed</button>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';

    const taskList = document.getElementById('taskList');
    const taskInput = document.getElementById('taskInput');
    const statsEl = document.getElementById('stats');
    const remainingEl = document.getElementById('remaining');

    function save() {
      localStorage.setItem('todos', JSON.stringify(tasks));
    }

    function render() {
      const visible = tasks.filter(t =>
        filter === 'all' ? true :
        filter === 'active' ? !t.done :
        t.done
      );

      taskList.innerHTML = '';
      visible.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' completed' : '');
        li.innerHTML = `
          <div class="checkbox" data-id="${task.id}" title="Toggle complete"></div>
          <span class="task-text">${escHtml(task.text)}</span>
          <button class="btn-delete" data-id="${task.id}" title="Delete task">×</button>
        `;
        taskList.appendChild(li);
      });

      const total = tasks.length;
      const done = tasks.filter(t => t.done).length;
      const left = total - done;
      statsEl.textContent = `${total} task${total !== 1 ? 's' : ''}`;
      remainingEl.textContent = `${left} item${left !== 1 ? 's' : ''} left`;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('addForm').addEventListener('submit', e => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      taskInput.value = '';
      save();
      render();
    });

    taskList.addEventListener('click', e => {
      const id = Number(e.target.dataset.id);
      if (e.target.classList.contains('checkbox')) {
        const t = tasks.find(t => t.id === id);
        if (t) { t.done = !t.done; save(); render(); }
      }
      if (e.target.classList.contains('btn-delete')) {
        tasks = tasks.filter(t => t.id !== id);
        save();
        render();
      }
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    document.getElementById('clearCompleted').addEventListener('click', () => {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
